spring:
  application:
    name: lawbackend2
  main:
    allow-circular-references: true
  mvc:
    static-path-pattern: /**

  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:law}?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-timeout: 30000
      connection-test-query: SELECT 1

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: false
        use_sql_comments: false
    open-in-view: false

  redis:
    host: ${REDIS_HOST:127.0.0.1}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    database: 0
    timeout: 3000ms
    lettuce:
      pool:
        max-active: 8
        max-wait: -1ms
        max-idle: 8
        min-idle: 0

server:
  address: 0.0.0.0
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api/v1

app:
  name: ${APP_NAME:法律破产管理系统}
  company: ${APP_COMPANY:}
  logo-url: ${APP_LOGO_URL:}
  footer-text: ${APP_FOOTER_TEXT:}
  default-language: ${APP_DEFAULT_LANGUAGE:zh-CN}
  timezone: ${APP_TIMEZONE:Asia/Shanghai}
  file:
    upload-path: ${FILE_UPLOAD_PATH:/data/law-upload}
    max-size: ${FILE_MAX_SIZE:52428800}
    allowed-types: ${FILE_ALLOWED_TYPES:jpg,jpeg,png,gif,bmp,pdf,doc,docx,xls,xlsx,ppt,pptx,txt,zip,rar}
    video:
      max-size: ${VIDEO_MAX_SIZE:524288000}
      allowed-types: ${VIDEO_ALLOWED_TYPES:mp4,avi,mov,wmv,flv,mkv,webm,mpeg,mpg,3gp}
      allowed-mime-types: ${VIDEO_ALLOWED_MIME_TYPES:video/mp4,video/avi,video/x-msvideo,video/quicktime,video/x-ms-wmv,video/x-flv,video/x-matroska,video/webm,video/mpeg,video/3gpp}
  cache:
    default-ttl-minutes: ${CACHE_TTL:10}
    recent-case:
      max-records: ${RECENT_CASE_MAX_RECORDS:50}
      expire-days: ${RECENT_CASE_EXPIRE_DAYS:30}
  security:
    password-min-length: ${PASSWORD_MIN_LENGTH:6}
    password-require-special-char: ${PASSWORD_REQUIRE_SPECIAL_CHAR:false}
    password-require-digit: ${PASSWORD_REQUIRE_DIGIT:false}
    password-require-uppercase: ${PASSWORD_REQUIRE_UPPERCASE:false}
  features:
    ai-chat: ${FEATURE_AI_CHAT:true}
    only-office: ${FEATURE_ONLY_OFFICE:true}
    video-upload: ${FEATURE_VIDEO_UPLOAD:true}
    data-export: ${FEATURE_DATA_EXPORT:true}
    batch-import: ${FEATURE_BATCH_IMPORT:true}
  swagger:
    enabled: ${SWAGGER_ENABLED:false}
    title: ${SWAGGER_TITLE:法律破产管理系统API}
    description: ${SWAGGER_DESCRIPTION:法律破产管理系统后端API文档}
    version: ${SWAGGER_VERSION:1.0.0}
    contact-name: ${SWAGGER_CONTACT_NAME:技术支持}
    contact-email: ${SWAGGER_CONTACT_EMAIL:support@example.com}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}
    allowed-methods: ${CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,OPTIONS}
    allowed-headers: ${CORS_ALLOWED_HEADERS:*}
    allow-credentials: ${CORS_ALLOW_CREDENTIALS:true}
    max-age: ${CORS_MAX_AGE:3600}

jwt:
  secret: ${JWT_SECRET:lawbackend2-secret-key-for-jwt-token-generation-and-verification-must-be-at-least-256-bits}
  access-token-expiration: 180000000
  refresh-token-expiration: 2592000000
  header: Authorization
  prefix: Bearer

token:
  blacklist:
    prefix: "token:blacklist:"
    ttl: 2592000000

sms:
  enabled: true
  expire-minutes: 5
  max-attempts: 5

login:
  max-fail-count: 5
  lock-minutes: 30

file:
  upload:
    path: ${FILE_UPLOAD_PATH:/data/law-upload}
    temp-token-expire-minutes: 30

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui
    enabled: true
    packages-to-scan: com.lawbackend2.lawbackend2.controller

app:
  server:
    url: ${APP_SERVER_URL:http://localhost:8080}
  file:
    download-url: ${APP_FILE_DOWNLOAD_URL:http://localhost:8080/api/v1/file/download/}

onlyoffice:
  server-url: ${ONLYOFFICE_SERVER_URL:http://localhost:8081}
  jwt:
    enabled: ${ONLYOFFICE_JWT_ENABLED:false}
    secret: ${ONLYOFFICE_JWT_SECRET:onlyoffice-secret}
  callback:
    url: ${ONLYOFFICE_CALLBACK_URL:http://localhost:8080/api/v1/onlyoffice/callback}

ai:
  gitee:
    api-url: ${AI_API_URL:https://ai.gitee.com/v1/chat/completions}
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:LegalOne-8B}

logging:
  level:
    root: INFO
    com.lawbackend2.lawbackend2: INFO
    org.hibernate.type.descriptor.sql.BasicBinder: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
