spring:
  application:
    name: lawbackend2

  datasource:
    url: jdbc:mysql://localhost:3306/law?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-timeout: 30000
      connection-test-query: SELECT 1

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: false
        use_sql_comments: false
    open-in-view: false

  redis:
    host: localhost
    port: 6379
    password:
    database: 0
    timeout: 3000ms
    lettuce:
      pool:
        max-active: 8
        max-wait: -1ms
        max-idle: 8
        min-idle: 0

server:
  port: 8080
  servlet:
    context-path: /api/v1

jwt:
  secret: lawbackend2-secret-key-for-jwt-token-generation-and-verification-must-be-at-least-256-bits
  access-token-expiration: 180000000
  refresh-token-expiration: 2592000000
  header: Authorization
  prefix: Bearer

token:
  blacklist:
    prefix: "token:blacklist:"
    ttl: 2592000000

sms:
  enabled: true
  expire-minutes: 5
  max-attempts: 5

login:
  max-fail-count: 5
  lock-minutes: 30

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui
    enabled: true
  packages-to-scan: com.lawbackend2.lawbackend2.controller

logging:
  level:
    root: INFO
    com.lawbackend2.lawbackend2: DEBUG
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
