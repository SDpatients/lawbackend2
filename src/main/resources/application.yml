info:
  app:
    name: lawbackend2
    description: 法律文书智能处理系统后端
    version: 0.0.1-SNAPSHOT
  build:
    time: ${maven.build.timestamp:2024-01-01T00:00:00Z}
  java:
    version: ${java.version}

spring:
  application:
    name: lawbackend2
  main:
    allow-circular-references: true
  mvc:
    static-path-pattern: /**

  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB

  datasource:
    url: jdbc:mysql://localhost:3306/law?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-timeout: 30000
      connection-test-query: SELECT 1

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: false
        use_sql_comments: false
    open-in-view: false

  redis:
    host: 127.0.0.1
    port: 6379
    password:
    database: 0
    timeout: 3000ms
    lettuce:
      pool:
        max-active: 8
        max-wait: -1ms
        max-idle: 8
        min-idle: 0

server:
  port: 8080
  servlet:
    context-path: /api/v1
jwt:
  secret: lawbackend2-secret-key-for-jwt-token-generation-and-verification-must-be-at-least-256-bits
  access-token-expiration: 180000000
  refresh-token-expiration: 2592000000
  header: Authorization
  prefix: Bearer

token:
  blacklist:
    prefix: "token:blacklist:"
    ttl: 2592000000

sms:
  enabled: true
  expire-minutes: 5
  max-attempts: 5

login:
  max-fail-count: 5
  lock-minutes: 30

file:
  upload:
    path: D:\\law-upload
    temp-token-expire-minutes: 30

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui
    enabled: true
    packages-to-scan: com.lawbackend2.lawbackend2.controller

app:
  server:
    url: http://localhost:8080
  file:
    download-url: http://localhost:8080/api/v1/file/download/

onlyoffice:
  server-url: http://localhost:8081
  jwt:
    enabled: false
    secret: onlyoffice-secret
  callback:
    url: http://localhost:8080/api/v1/onlyoffice/callback

ai:
  gitee:
    api-url: https://ai.gitee.com/v1/chat/completions
    api-key: XC9P4NWOC5TLSJ0GC9DNZMATGNNKOLSBLYRIOF14
    model: LegalOne-8B

logging:
  level:
    root: INFO
    com.lawbackend2.lawbackend2: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

backup:
  enabled: true
  cron: "0 0 2 * * ?"
  path: D:\\law-backup
  retention-days: 30
  mysqldump-path: "C:/Program Files/MySQL/MySQL Server 8.0/bin/mysqldump.exe"
  host: localhost
  port: 3306
  username: root
  password: 123456
  database: law
  compress: true

management:
  endpoints:
    web:
      exposure:
        include: "*"
      base-path: /actuator
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
    loggers:
      enabled: true
    env:
      show-values: always
    configprops:
      show-values: always
  health:
    db:
      enabled: true
    redis:
      enabled: true
    diskspace:
      enabled: true
      threshold: 10GB
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        http.server.requests: true
      percentiles:
        http.server.requests: 0.5,0.95,0.99
  info:
    env:
      enabled: true
    java:
      enabled: true
    os:
      enabled: true

license:
  enabled: true
  file-path: D:\\law-backup\\license.lic
  public-key: |
