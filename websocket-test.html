<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebSocket实时通信测试</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }

        .status-bar {
            background: #f8f9fa;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #e9ecef;
            flex-wrap: wrap;
            gap: 10px;
        }

        .status-item {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #dc3545;
            transition: all 0.3s ease;
        }

        .status-indicator.connected {
            background: #28a745;
            box-shadow: 0 0 10px #28a745;
        }

        .status-indicator.connecting {
            background: #ffc107;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .main-content {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 0;
        }

        .left-panel, .center-panel, .right-panel {
            padding: 30px;
        }

        .left-panel {
            background: #f8f9fa;
            border-right: 2px solid #e9ecef;
        }

        .center-panel {
            background: white;
            border-right: 2px solid #e9ecef;
        }

        .panel-title {
            font-size: 1.5em;
            margin-bottom: 20px;
            color: #333;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #555;
        }

        .form-group input, .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 1em;
            transition: all 0.3s ease;
        }

        .form-group input:focus, .form-group textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .form-group textarea {
            min-height: 100px;
            resize: vertical;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-danger {
            background: #dc3545;
            color: white;
        }

        .btn-danger:hover {
            background: #c82333;
        }

        .btn-success {
            background: #28a745;
            color: white;
        }

        .btn-success:hover {
            background: #218838;
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none !important;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .message-list {
            max-height: 400px;
            overflow-y: auto;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            padding: 15px;
            background: white;
        }

        .message {
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 8px;
            background: #f8f9fa;
            border-left: 4px solid #667eea;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .message.sent {
            background: #e7f3ff;
            border-left-color: #007bff;
        }

        .message.received {
            background: #f0f8ff;
            border-left-color: #28a745;
        }

        .message.system {
            background: #fff3cd;
            border-left-color: #ffc107;
        }

        .message-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
            font-size: 0.9em;
            color: #666;
        }

        .message-content {
            font-size: 1.1em;
            color: #333;
        }

        .message-time {
            font-size: 0.8em;
            color: #999;
        }

        .online-users {
            margin-top: 20px;
            padding: 15px;
            background: white;
            border-radius: 8px;
            border: 2px solid #e9ecef;
        }

        .online-users h3 {
            margin-bottom: 10px;
            color: #333;
        }

        .user-list {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .user-tag {
            padding: 6px 12px;
            background: #e7f3ff;
            border-radius: 20px;
            font-size: 0.9em;
            color: #007bff;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .user-tag .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #28a745;
        }

        .log-panel {
            margin-top: 20px;
            padding: 15px;
            background: #1e1e1e;
            border-radius: 8px;
            color: #00ff00;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
            max-height: 200px;
            overflow-y: auto;
        }

        .log-entry {
            margin-bottom: 5px;
            padding: 5px;
            border-bottom: 1px solid #333;
        }

        .log-entry.error {
            color: #ff6b6b;
        }

        .log-entry.success {
            color: #51cf66;
        }

        .log-entry.info {
            color: #339af0;
        }

        .user-info {
            background: white;
            padding: 15px;
            border-radius: 8px;
            border: 2px solid #e9ecef;
            margin-bottom: 20px;
        }

        .user-info h3 {
            margin-bottom: 10px;
            color: #333;
        }

        .user-info p {
            margin-bottom: 5px;
            color: #666;
        }

        .user-info strong {
            color: #333;
        }

        @media (max-width: 1200px) {
            .main-content {
                grid-template-columns: 1fr 1fr;
            }

            .left-panel {
                grid-column: 1 / -1;
                border-right: none;
                border-bottom: 2px solid #e9ecef;
            }
        }

        @media (max-width: 768px) {
            .main-content {
                grid-template-columns: 1fr;
            }

            .center-panel {
                border-right: none;
                border-bottom: 2px solid #e9ecef;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚀 WebSocket实时通信测试</h1>
            <p>支持JWT认证和局域网内多用户实时通信</p>
        </div>

        <div class="status-bar">
            <div class="status-item">
                <div class="status-indicator" id="loginStatusIndicator"></div>
                <span id="loginStatus">未登录</span>
            </div>
            <div class="status-item">
                <div class="status-indicator" id="wsStatusIndicator"></div>
                <span id="wsStatus">未连接</span>
            </div>
            <div class="status-item">
                <span>在线用户: <strong id="onlineCount">0</strong></span>
            </div>
            <div class="status-item">
                <span>我的ID: <strong id="myUserId">-</strong></span>
            </div>
        </div>

        <div class="main-content">
            <div class="left-panel">
                <h2 class="panel-title">🔐 用户登录</h2>

                <div id="loginForm">
                    <div class="form-group">
                        <label for="serverUrl">服务器地址</label>
                        <input type="text" id="serverUrl" value="http://localhost:8080/api/v1" placeholder="http://localhost:8080/api/v1">
                    </div>

                    <div class="form-group">
                        <label for="username">用户名</label>
                        <input type="text" id="username" value="admin" placeholder="输入用户名">
                    </div>

                    <div class="form-group">
                        <label for="password">密码</label>
                        <input type="password" id="password" value="123456" placeholder="输入密码">
                    </div>

                    <div class="btn-group">
                        <button class="btn btn-success" id="loginBtn">登录</button>
                        <button class="btn btn-danger" id="logoutBtn" disabled>登出</button>
                    </div>
                </div>

                <div id="userInfo" style="display: none;" class="user-info">
                    <h3>👤 用户信息</h3>
                    <p>用户ID: <strong id="displayUserId">-</strong></p>
                    <p>用户名: <strong id="displayUsername">-</strong></p>
                    <p>真实姓名: <strong id="displayRealName">-</strong></p>
                </div>

                <h2 class="panel-title" style="margin-top: 30px;">📡 WebSocket连接</h2>

                <div class="btn-group">
                    <button class="btn btn-primary" id="connectBtn" onclick="connect()" disabled>连接</button>
                    <button class="btn btn-danger" id="disconnectBtn" onclick="disconnect()" disabled>断开</button>
                </div>
            </div>

            <div class="center-panel">
                <h2 class="panel-title">📝 发送消息</h2>

                <div class="form-group">
                    <label for="receiverId">接收者用户ID</label>
                    <input type="number" id="receiverId" value="2" placeholder="输入接收者ID">
                </div>

                <div class="form-group">
                    <label for="messageContent">消息内容</label>
                    <textarea id="messageContent" placeholder="输入要发送的消息..."></textarea>
                </div>

                <button class="btn btn-primary" id="sendBtn" onclick="sendMessage()" disabled>
                    发送消息
                </button>

                <div class="online-users">
                    <h3>👥 在线用户列表</h3>
                    <div class="user-list" id="userList">
                        <span style="color: #999;">暂无在线用户</span>
                    </div>
                </div>
            </div>

            <div class="right-panel">
                <h2 class="panel-title">💬 消息记录</h2>
                <div class="message-list" id="messageList">
                    <div class="message system">
                        <div class="message-header">
                            <span>系统消息</span>
                            <span class="message-time">刚刚</span>
                        </div>
                        <div class="message-content">
                            欢迎使用WebSocket实时通信测试工具！请先登录。
                        </div>
                    </div>
                </div>

                <h2 class="panel-title" style="margin-top: 30px;">📋 系统日志</h2>
                <div class="log-panel" id="logPanel">
                    <div class="log-entry info">[系统] 页面加载完成，等待登录...</div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.bootcdn.net/ajax/libs/sockjs-client/1.5.2/sockjs.min.js"></script>
    <script src="https://cdn.bootcdn.net/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <script>
        let stompClient = null;
        let connected = false;
        let loggedIn = false;
        let currentUser = null;
        let accessToken = null;
        let refreshToken = null;

        function addLog(message, type = 'info') {
            const logPanel = document.getElementById('logPanel');
            const logEntry = document.createElement('div');
            logEntry.className = `log-entry ${type}`;
            const timestamp = new Date().toLocaleTimeString();
            logEntry.textContent = `[${timestamp}] ${message}`;
            logPanel.appendChild(logEntry);
            logPanel.scrollTop = logPanel.scrollHeight;
        }

        function addMessage(message, type = 'received') {
            const messageList = document.getElementById('messageList');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${type}`;
            
            const time = new Date().toLocaleTimeString();
            let sender = '系统';
            let content = JSON.stringify(message);
            
            // 如果是WebSocketMessage对象，从data字段中获取实际消息
            if (message.data) {
                // data字段包含ChatMessageResponse
                const actualMessage = message.data;
                sender = actualMessage.senderId || '系统';
                content = actualMessage.content || JSON.stringify(actualMessage);
            } else if (message.content) {
                // 直接有content字段
                sender = message.senderId || '系统';
                content = message.content;
            }
            
            messageDiv.innerHTML = `
                <div class="message-header">
                    <span>${type === 'sent' ? '我' : '用户 ' + sender}</span>
                    <span class="message-time">${time}</span>
                </div>
                <div class="message-content">${content}</div>
            `;
            
            messageList.appendChild(messageDiv);
            messageList.scrollTop = messageList.scrollHeight;
        }

        function updateLoginStatus(status) {
            const indicator = document.getElementById('loginStatusIndicator');
            const statusText = document.getElementById('loginStatus');
            const loginBtn = document.getElementById('loginBtn');
            const logoutBtn = document.getElementById('logoutBtn');
            const connectBtn = document.getElementById('connectBtn');
            const loginForm = document.getElementById('loginForm');
            const userInfo = document.getElementById('userInfo');

            indicator.className = 'status-indicator ' + status;

            switch(status) {
                case 'logged':
                    statusText.textContent = '已登录';
                    loginBtn.disabled = true;
                    logoutBtn.disabled = false;
                    connectBtn.disabled = false;
                    loginForm.style.display = 'none';
                    userInfo.style.display = 'block';
                    break;
                case 'logging':
                    statusText.textContent = '登录中...';
                    loginBtn.disabled = true;
                    logoutBtn.disabled = true;
                    connectBtn.disabled = true;
                    break;
                default:
                    statusText.textContent = '未登录';
                    loginBtn.disabled = false;
                    logoutBtn.disabled = true;
                    connectBtn.disabled = true;
                    loginForm.style.display = 'block';
                    userInfo.style.display = 'none';
            }
        }

        function updateWsStatus(status) {
            const indicator = document.getElementById('wsStatusIndicator');
            const statusText = document.getElementById('wsStatus');
            const connectBtn = document.getElementById('connectBtn');
            const disconnectBtn = document.getElementById('disconnectBtn');
            const sendBtn = document.getElementById('sendBtn');

            indicator.className = 'status-indicator ' + status;

            switch(status) {
                case 'connected':
                    statusText.textContent = '已连接';
                    connectBtn.disabled = true;
                    disconnectBtn.disabled = false;
                    sendBtn.disabled = false;
                    break;
                case 'connecting':
                    statusText.textContent = '连接中...';
                    connectBtn.disabled = true;
                    disconnectBtn.disabled = true;
                    sendBtn.disabled = true;
                    break;
                default:
                    statusText.textContent = '未连接';
                    connectBtn.disabled = false;
                    disconnectBtn.disabled = true;
                    sendBtn.disabled = true;
            }
        }

        async function login() {
            const serverUrl = document.getElementById('serverUrl').value;
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;

            if (!username || !password) {
                alert('请输入用户名和密码');
                return;
            }

            updateLoginStatus('logging');
            addLog(`尝试登录用户: ${username}`, 'info');

            try {
                const response = await fetch(`${serverUrl}/auth/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        username: username,
                        password: password
                    })
                });

                const data = await response.json();

                if (data.code === 200 && data.data) {
                    currentUser = data.data;
                    accessToken = data.data.accessToken;
                    refreshToken = data.data.refreshToken;

                    localStorage.setItem('accessToken', accessToken);
                    localStorage.setItem('refreshToken', refreshToken);
                    localStorage.setItem('currentUser', JSON.stringify(currentUser));

                    updateLoginStatus('logged');
                    document.getElementById('myUserId').textContent = currentUser.userId;
                    document.getElementById('displayUserId').textContent = currentUser.userId;
                    document.getElementById('displayUsername').textContent = currentUser.username;
                    document.getElementById('displayRealName').textContent = currentUser.realName || '-';

                    addLog('登录成功!', 'success');
                    addMessage({ content: `欢迎 ${currentUser.realName || currentUser.username}！` }, 'system');
                } else {
                    throw new Error(data.message || '登录失败');
                }
            } catch (error) {
                updateLoginStatus('disconnected');
                addLog(`登录失败: ${error.message}`, 'error');
                alert('登录失败: ' + error.message);
            }
        }

        function logout() {
            if (stompClient && connected) {
                disconnect();
            }

            localStorage.removeItem('accessToken');
            localStorage.removeItem('refreshToken');
            localStorage.removeItem('currentUser');

            currentUser = null;
            accessToken = null;
            refreshToken = null;

            updateLoginStatus('disconnected');
            document.getElementById('myUserId').textContent = '-';
            document.getElementById('displayUserId').textContent = '-';
            document.getElementById('displayUsername').textContent = '-';
            document.getElementById('displayRealName').textContent = '-';

            addLog('已登出', 'info');
            addMessage({ content: '已登出' }, 'system');
        }

        function connect() {
            const serverUrl = document.getElementById('serverUrl').value;
            const wsUrl = `${serverUrl}/ws?token=${accessToken}`;
            
            if (!accessToken) {
                alert('请先登录');
                return;
            }

            updateWsStatus('connecting');
            addLog(`尝试连接到WebSocket: ${wsUrl}`, 'info');

            const socket = new SockJS(wsUrl);
            stompClient = Stomp.over(socket);

            const headers = {
                'userId': currentUser.userId.toString()
            };

            stompClient.connect(headers, 
                function(frame) {
                    connected = true;
                    updateWsStatus('connected');
                    addLog('WebSocket连接成功!', 'success');
                    addLog(`连接帧: ${frame}`, 'info');

                    subscribeToTopics();
                },
                function(error) {
                    connected = false;
                    updateWsStatus('disconnected');
                    addLog(`连接失败: ${error}`, 'error');
                }
            );
        }

        function subscribeToTopics() {
            if (!stompClient || !connected) {
                addLog('未连接到服务器，无法订阅', 'error');
                return;
            }

            addLog('开始订阅消息主题...', 'info');

            // 订阅聊天消息主题 - 确保使用正确的主题路径
            const chatSubscription = stompClient.subscribe('/user/queue/chat', function(message) {
                addLog(`收到原始消息: ${message.body}`, 'debug');
                try {
                    const data = JSON.parse(message.body);
                    addLog(`收到聊天消息: ${JSON.stringify(data)}`, 'info');
                    addMessage(data, 'received');
                } catch (error) {
                    addLog(`解析消息失败: ${error.message}`, 'error');
                    addLog(`消息内容: ${message.body}`, 'error');
                }
            });
            addLog(`已订阅聊天主题: /user/queue/chat, 订阅ID: ${chatSubscription.id}`, 'success');

            // 订阅广播消息主题
            stompClient.subscribe('/topic/broadcast', function(message) {
                const data = JSON.parse(message.body);
                addLog(`收到广播消息: ${JSON.stringify(data)}`, 'info');
                
                if (data.type === 'USER_ONLINE' || data.type === 'USER_OFFLINE') {
                    updateUserList(data);
                }
            });

            // 订阅正在输入状态主题
            stompClient.subscribe('/topic/chat/typing', function(message) {
                addLog(`收到正在输入状态: ${message.body}`, 'info');
            });

            addLog('所有主题订阅完成', 'success');
        }

        function updateUserList(data) {
            const onlineCount = data.data?.onlineCount || 0;
            document.getElementById('onlineCount').textContent = onlineCount;
            
            const userList = document.getElementById('userList');
            
            if (data.type === 'USER_ONLINE') {
                const userId = data.data?.userId;
                if (userId && userId != currentUser.userId) {
                    const existingUser = document.getElementById(`user-${userId}`);
                    if (!existingUser) {
                        const userTag = document.createElement('div');
                        userTag.className = 'user-tag';
                        userTag.id = `user-${userId}`;
                        userTag.innerHTML = `
                            <span class="dot"></span>
                            <span>用户 ${userId}</span>
                        `;
                        userList.appendChild(userTag);
                    }
                }
                addMessage({ content: `用户 ${userId} 上线了` }, 'system');
            } else if (data.type === 'USER_OFFLINE') {
                const userId = data.data?.userId;
                const existingUser = document.getElementById(`user-${userId}`);
                if (existingUser) {
                    existingUser.remove();
                }
                addMessage({ content: `用户 ${userId} 下线了` }, 'system');
            }
        }

        function disconnect() {
            if (stompClient && connected) {
                stompClient.disconnect(function() {
                    connected = false;
                    updateWsStatus('disconnected');
                    addLog('WebSocket连接已断开', 'info');
                });
            }
        }

        function sendMessage() {
            if (!stompClient || !connected) {
                alert('请先连接到服务器');
                return;
            }

            const receiverId = document.getElementById('receiverId').value;
            const content = document.getElementById('messageContent').value;

            if (!receiverId) {
                alert('请输入接收者ID');
                return;
            }

            if (!content) {
                alert('请输入消息内容');
                return;
            }

            const message = {
                receiverId: parseInt(receiverId),
                messageType: 'TEXT',
                content: content
            };

            stompClient.send('/app/chat/send', {}, JSON.stringify(message));
            
            addMessage({ content: content, senderId: currentUser.userId }, 'sent');
            addLog(`发送消息给用户 ${receiverId}: ${content}`, 'info');
            
            document.getElementById('messageContent').value = '';
        }

        window.addEventListener('beforeunload', function() {
            if (stompClient && connected) {
                stompClient.disconnect();
            }
        });

        document.getElementById('messageContent').addEventListener('keypress', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        window.addEventListener('load', function() {
            // 添加事件监听器
            document.getElementById('loginBtn').addEventListener('click', login);
            document.getElementById('logoutBtn').addEventListener('click', logout);
            document.getElementById('connectBtn').addEventListener('click', connect);
            document.getElementById('disconnectBtn').addEventListener('click', disconnect);
            document.getElementById('sendBtn').addEventListener('click', sendMessage);
            
            // 从本地存储恢复登录状态
            const savedToken = localStorage.getItem('accessToken');
            const savedUser = localStorage.getItem('currentUser');
            
            if (savedToken && savedUser) {
                try {
                    accessToken = savedToken;
                    refreshToken = localStorage.getItem('refreshToken');
                    currentUser = JSON.parse(savedUser);
                    
                    updateLoginStatus('logged');
                    document.getElementById('myUserId').textContent = currentUser.userId;
                    document.getElementById('displayUserId').textContent = currentUser.userId;
                    document.getElementById('displayUsername').textContent = currentUser.username;
                    document.getElementById('displayRealName').textContent = currentUser.realName || '-';
                    
                    addLog('已从本地存储恢复登录状态', 'info');
                    addMessage({ content: `欢迎回来 ${currentUser.realName || currentUser.username}！` }, 'system');
                } catch (error) {
                    addLog('恢复登录状态失败，请重新登录', 'error');
                    localStorage.clear();
                }
            }
        });
    </script>
</body>
</html>
